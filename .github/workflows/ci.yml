name: CI

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build and test
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 25

      # Validates the Gradle wrapper and caches dependencies between runs.
      - uses: gradle/actions/setup-gradle@v5

      # Shared rules on the JVM and in a headless browser, the server suite against real Postgres and Redis
      # (Testcontainers uses the runner's Docker), and a production build of the site.
      - name: Test and build
        run: ./gradlew :shared:jvmTest :shared:jsTest :server:test :server:installDist :web:assembleSite

      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: test-reports
          path: |
            server/build/reports/tests
            shared/build/reports/tests
