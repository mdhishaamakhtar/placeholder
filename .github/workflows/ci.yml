name: CI

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build and test
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 25

      # Validates the Gradle wrapper and caches dependencies between runs.
      - uses: gradle/actions/setup-gradle@v6

      # Formatting and lint first: the cheapest failure, and the one most worth catching before review.
      - name: Format and lint
        run: ./gradlew spotlessCheck

      # Shared rules on the JVM and in a headless browser, the editor's state holder in that browser, the server
      # suite against real Postgres, Redis and Kafka (Testcontainers uses the runner's Docker), and a production
      # build of the site.
      - name: Test and build
        run: ./gradlew :shared:jvmTest :shared:jsTest :web:jsTest :server:test :server:installDist :web:assembleSite

      # Only what passed everything above ships: Railway runs this image rather than building the repo itself.
      - name: Log in to GHCR
        if: github.event_name == 'push'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish image
        if: github.event_name == 'push'
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile
          platforms: linux/amd64
          push: true
          tags: |
            ghcr.io/${{ github.repository }}:latest
            ghcr.io/${{ github.repository }}:${{ github.sha }}
          labels: org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}

      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: test-reports
          path: |
            server/build/reports/tests
            shared/build/reports/tests
